<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hi, Have a Good Day</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            background:
                radial-gradient(circle at 20% 20%, #173b70 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #40166b 0%, transparent 35%),
                linear-gradient(135deg, #050816, #0b1026, #160b2d);
        }

        /* Background Animation */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.5;
            animation: float 8s ease-in-out infinite;
        }

        .circle1 {
            width: 250px;
            height: 250px;
            background: #00d9ff;
            top: -80px;
            left: -80px;
        }

        .circle2 {
            width: 180px;
            height: 180px;
            background: #9d00ff;
            bottom: -50px;
            right: 10%;
            animation-delay: 2s;
        }

        .circle3 {
            width: 100px;
            height: 100px;
            background: #006eff;
            top: 20%;
            right: 15%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }

            50% {
                transform: translateY(-30px) translateX(20px);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;

            width: min(90%, 700px);
            padding: 60px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.03);

            animation: appear 1.2s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Name */
        .name {
            font-size: 18px;
            color: #8eeaff;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .student-id {
            font-size: 15px;
            color: #b8c7e0;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        /* Main Text */
        h1 {
            font-size: clamp(45px, 8vw, 80px);
            font-weight: 700;

            background: linear-gradient(
                90deg,
                #00eaff,
                #ffffff,
                #b86cff,
                #00eaff
            );

            background-size: 300%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: gradient 5s linear infinite;
        }

        @keyframes gradient {
            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        p {
            margin-top: 15px;
            font-size: 20px;
            color: #cbd5e1;
        }

        /* Button */
        button {
            margin-top: 35px;

            padding: 14px 40px;

            font-size: 17px;
            font-weight: bold;

            color: white;

            background: linear-gradient(
                90deg,
                #008cff,
                #8b3dff
            );

            border: none;
            border-radius: 50px;

            cursor: pointer;

            box-shadow: 0 8px 25px rgba(72, 100, 255, 0.4);

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-4px) scale(1.05);

            box-shadow:
                0 12px 35px rgba(72, 100, 255, 0.7);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Modal Slide Container */
        .modal {
            display: none; 
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .slide-box {
            position: relative;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
        }

        .slide-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 50%;
            margin: 0;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            z-index: 101;
            font-weight: bold;
        }

        .slide-counter {
            margin-top: 15px;
            font-size: 16px;
            color: #8eeaff;
            letter-spacing: 1px;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 45px 20px;
            }

            .name {
                font-size: 14px;
            }

            .student-id {
                font-size: 12px;
            }

            p {
                font-size: 16px;
            }

            button {
                padding: 13px 35px;
            }

            .nav-btn {
                padding: 10px 15px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Animation -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <!-- Main Content -->
    <div class="container">

        <div class="name">
            THANAPON NOPPASART
        </div>

        <div class="student-id">
            2610711302011 · UTCC
        </div>

        <h1>Hi, Have a Nice Day</h1>

        <p>
            Welcome to my first web project 🚀
        </p>

        <button onclick="openSlides()">
            Click
        </button>

    </div>

    <!-- Slide Viewer Modal -->
    <div id="slideModal" class="modal">
        <span class="close-btn" onclick="closeSlides()">&times;</span>
        
        <div class="slide-box">
            <button class="nav-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>
            <img id="currentImage" class="slide-img" src="" alt="Slide Image">
            <button class="nav-btn next-btn" onclick="changeSlide(1)">&#10090;</button>
        </div>

        <div class="slide-counter" id="slideCounter">1 / 30</div>
    </div>

    <script>
        // ใส่ path รูปภาพของคุณทั้ง 30 รูปไว้ใน Array นี้
        // หากไฟล์รูปอยู่ในโฟลเดอร์ images ให้เปลี่ยนเป็น 'images/page1.png' เป็นต้น
        const slides = [
            'images/page1.jpg',
            'images/page2.jpg',
            'images/page3.jpg',
            'images/page4.jpg',
            'images/page5.jpg',
            'images/page6.jpg',
            'images/page7.jpg',
            'images/page8.jpg',
            'images/page9.jpg',
            'images/page10.jpg',
            'images/page11.jpg',
            'images/page12.jpg',
            'images/page13.jpg',
            'images/page14.jpg',
            'images/page15.jpg',
            'images/page16.jpg',
            'images/page17.jpg',
            'images/page18.jpg',
            'images/page19.jpg',
            'images/page20.jpg',
            'images/page21.jpg',
            'images/page22.jpg',
            'images/page23.jpg',
            'images/page24.jpg',
            'images/page25.jpg',
            'images/page26.jpg',
            'images/page27.jpg',
            'images/page28.jpg',
            'images/page29.jpg',
            'images/page30.jpg'
        ];

        let currentIndex = 0;

        function openSlides() {
            document.getElementById("slideModal").classList.add("active");
            showSlide(currentIndex);
        }

        function closeSlides() {
            document.getElementById("slideModal").classList.remove("active");
        }

        function showSlide(index) {
            const imgElement = document.getElementById("currentImage");
            const counterElement = document.getElementById("slideCounter");

            imgElement.src = slides[index];
            counterElement.textContent = `${index + 1} / ${slides.length}`;
        }

        function changeSlide(direction) {
            currentIndex += direction;

            // วนลูปกลับไปสไลด์แรกเมื่อเกิน 30 หรือวนไปสไลด์สุดท้ายถ้าถอยหลังเกินหน้า 1
            if (currentIndex >= slides.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = slides.length - 1;
            }

            showSlide(currentIndex);
        }

        // สามารถใช้ลูกศรซ้าย-ขวา บนแป้นพิมพ์เลื่อนรูปภาพได้ด้วย
        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById("slideModal");
            if (modal.classList.contains("active")) {
                if (e.key === "ArrowLeft") {
                    changeSlide(-1);
                } else if (e.key === "ArrowRight") {
                    changeSlide(1);
                } else if (e.key === "Escape") {
                    closeSlides();
                }
            }
        });
    </script>

</body>
</html>
